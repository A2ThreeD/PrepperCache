name: PrepperCache checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install unit test dependency
        run: python3 -m pip install -r tests/requirements-unit.txt
      - name: Run unit and syntax checks
        run: bash scripts/check.sh
      - name: Install browser test tools
        run: |
          python3 -m pip install -r tests/requirements-smoke.txt
          python3 -m playwright install --with-deps chromium
      - name: Check browser workflows
        run: bash scripts/check.sh --browser
