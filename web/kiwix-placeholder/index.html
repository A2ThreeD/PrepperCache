  <title>PrepperCache Library</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      background: var(--bg-secondary, #ffffff);
      color: var(--text-primary, #172b2d);
      padding: 40px 16px;

      max-width: 760px;
